name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Voir les fichiers du dépôt
        run: ls -la && cat project.yml
      - name: Générer le projet Xcode
        run: |
          brew install xcodegen || true
          xcodegen generate --spec project.yml
          ls -la
      - name: Compiler
        run: |
          xcodebuild -project SiteApp.xcodeproj -scheme SiteApp \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Créer l'IPA
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/SiteApp.app Payload/
          zip -r SiteApp.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SiteApp-ipa
          path: SiteApp.ipa

name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Générer le projet Xcode
        run: |
          brew install xcodegen || true
          xcodegen generate --spec project.yml
      - name: Préparer l'icône et le logo
        run: |
          ICON=Sources/Assets.xcassets/AppIcon.appiconset/icon.png
          sips -z 1024 1024 "$ICON"
          sips -s format jpeg "$ICON" --out /tmp/icon.jpg
          sips -s format png /tmp/icon.jpg --out "$ICON"

          LOGO=Sources/Assets.xcassets/Logo.imageset
          mkdir -p "$LOGO"
          cp "$ICON" "$LOGO/logo.png"
          echo '{"images":[{"filename":"logo.png","idiom":"universal"}],"info":{"author":"xcode","version":1}}' > "$LOGO/Contents.json"

          COLOR=Sources/Assets.xcassets/LaunchBlack.colorset
          mkdir -p "$COLOR"
          echo '{"colors":[{"color":{"color-space":"srgb","components":{"red":"0","green":"0","blue":"0","alpha":"1"}},"idiom":"universal"}],"info":{"author":"xcode","version":1}}' > "$COLOR/Contents.json"
      - name: Compiler
        run: |
          xcodebuild -project SiteApp.xcodeproj -scheme SiteApp \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Créer l'IPA
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/SiteApp.app Payload/
          zip -r SiteApp.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SiteApp-ipa
          path: SiteApp.ipa
